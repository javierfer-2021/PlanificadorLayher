<mat-progress-bar mode="indeterminate" *ngIf="LPGen(WSDatos_Validando)"></mat-progress-bar>

<div class="container" #container (window:resize)="onResize()" style="overflow-y: auto; height: 100%;">
    <div #pantalla>

            <!-- Titulo -->
            <div class="row px-1 py-2 titulo">
                <div class="col pt-1 px-1">                    
                    <div class="fs-11 fs-sm-16 fs-md-16 fs-lg-16 fs-xl-16"> {{_titulo}} </div>
                </div> 
                <!-- <div class="col-2 pt-0 px-1" style="text-align: end;">
                    <button type="button" class="btn btn-outline-secondary botonAyuda" (click)="mostrarAyuda()">
                        <i class="bi bi-question-circle"></i>
                    </button>                    
                </div>  -->
            </div>  

            <!-- grid lista usuarios -->    
            <div class="row pt-1">
                <div class="col pt-1 px-1">    
                    <app-cmp-data-grid #dg [dgConfig]="dgConfig">
                    </app-cmp-data-grid>
                </div>
            </div>

            <!-- Calculo Total Stock -->    
            <div class="row pt-1">
                <div class="col pt-1 px-2"> 
                    <p style="text-align: right;">Total Stock Disponible: <b>{{_totalStock}}</b></p>   
                </div>
            </div>

    </div>
</div>

<div #btnFooter>
    <app-cmp-botones-pantallas [botones]="btnAciones"></app-cmp-botones-pantallas>
</div>
